
input:
- "10" # Project name = auto_ncm_default (matches configured project)
- "vm-@@{calm_array_index}@@-@@{calm_time}@@"
- "y"  # Want Category
- ""   # Category search text (blank = list all)
- "4"  # Category: AppFamily:Backup
- "y"  # Add more categories
- "8"  # Category: AppFamily:Databases
- "y"  # Replace old one
- "n"  # Add more catergories
- "1"  # no. of VCPU
- "1"  # cores per VCPU
- "1"  # memory in (GiB)
- "1"  # Device Type = CD_ROM
- "1"  # Device Bus = SATA (SATA/IDE)
- "1"  # Image Name = SQLServer2014SP2-FullSlipstream-x64
- "y"  # Is it bootable
- "n"  # Want more disks
- "1"  # Boot_type = "Legacy BIOS"
- "n"  # Want virtual disks
- "n"  # Want network adapters
- "n"  # Want Customization script

cli_assertions:
- "Create spec for your AHV VM:"
- "Category corresponding to key AppFamily already exists"

spec_assertions:
- "SQLServer2014SP2-FullSlipstream-x64"  # Check 1st disk image name
- "Databases"  # Check for latest category

spec_false_assertions:
- "Backup"  # Check for old category

dependencies:
 # Resolve setup-dependent indexes by resource name (see populators.py)
- [0, "projects/auto_ncm_default"]
- [4, "categories/AppFamily:Backup"]
- [6, "categories/AppFamily:Databases"]
- [14, "cdrom_images/SQLServer2014SP2-FullSlipstream-x64-ENU.iso"]
